<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Clear space around the NHS login button</title>
  <desc id="desc">A standard NHS login button shown at its approved desktop proportions. Its height is labelled y and clear space of 0.5y is shown above, below and to the right.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#212b32"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="#ffffff"/>
  <rect x="40" y="70" width="1120" height="460" fill="#e8edee"/>
  <line x1="40" y1="372" x2="1160" y2="372" stroke="#d8dde0" stroke-width="3"/>

  <!-- y is the rendered height of the button. Clear space is 0.5y. -->
  <line x1="150" y1="260" x2="150" y2="372" stroke="#212b32" stroke-width="3" stroke-dasharray="3 7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="106" y="327" fill="#212b32" font-family="Arial, Helvetica, sans-serif" font-size="32">y</text>

  <line x1="500" y1="204" x2="500" y2="250" stroke="#212b32" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="456" y="171" fill="#212b32" font-family="Arial, Helvetica, sans-serif" font-size="32">0.5y</text>

  <line x1="500" y1="382" x2="500" y2="438" stroke="#212b32" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="456" y="486" fill="#212b32" font-family="Arial, Helvetica, sans-serif" font-size="32">0.5y</text>

  <line x1="820" y1="316" x2="876" y2="316" stroke="#212b32" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="895" y="327" fill="#212b32" font-family="Arial, Helvetica, sans-serif" font-size="32">0.5y</text>

  <!-- Standard NHS login button at 2× approved desktop CSS dimensions: 19px type, 12px vertical and 16px horizontal padding, 4px shadow. -->
  <rect x="180" y="260" width="640" height="112" rx="8" fill="#003087" transform="translate(0 8)"/>
  <rect x="180" y="260" width="640" height="112" rx="8" fill="#005eb8"/>
  <g transform="translate(212 288) scale(2)">
    <path fill="#fff" d="M0 0h40v16H0z"/>
    <path fill="#005eb8" d="M3.9 1.5h4.4l2.6 9h.1l1.8-9h3.3l-2.8 13H9l-2.7-9h-.1l-1.8 9H1.1M17.3 1.5h3.6l-1 4.9h4L25 1.5h3.5l-2.7 13h-3.5l1.1-5.6h-4.1l-1.2 5.6h-3.4M37.7 4.4c-.7-.3-1.6-.6-2.9-.6-1.4 0-2.5.2-2.5 1.3 0 1.8 5.1 1.2 5.1 5.1 0 3.6-3.3 4.5-6.4 4.5-1.3 0-2.9-.3-4-.7l.8-2.7c.7.4 2.1.7 3.2.7s2.8-.2 2.8-1.5c0-2.1-5.1-1.3-5.1-5 0-3.4 2.9-4.4 5.8-4.4 1.6 0 3.1.2 4 .6"/>
  </g>
  <text x="378" y="329" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Continue to NHS login</text>
</svg>
