<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <base href="/nhslogin">
     <link rel="stylesheet"  href="nhslogin/css/main.css">
     <link rel="shortcut icon" href="/nhslogin/images/favicon.ico" type="image/x-icon">
<link rel="shortcut icon" href="/nhslogin/images/favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="/nhslogin/images/apple-touch-icon-180x180.png">
<link rel="mask-icon" href="/nhslogin/images/favicon.svg" color="#005eb8">
<link rel="icon" sizes="192x192" href="/nhslogin/images/favicon-192x192.png">
    <script src="nhslogin/js/main.min.js" ></script> 

<title>NHS login shown first with a separate service sign-in form</title>
  </head>
  <body>

<div class="nhsuk-width-container">
  <main class="nhsuk-main-wrapper app-main-wrapper" id="maincontent">

            <style>
.button-placement-example{max-width:520px;margin:0 auto;border:1px solid #d8dde0;background:#fff;color:#212b32;font-family:Arial,Helvetica,sans-serif}.button-placement-example__brand{height:74px;padding:15px 20px;background:#f0faed;border-bottom:1px solid #c4dab9}.button-placement-example__brand img{display:block;width:210px;max-width:100%;height:auto}.button-placement-example__content{padding:26px 28px 30px}.button-placement-example h1{margin:0 0 22px;color:#212b32;font-size:28px;line-height:1.18}.button-placement-example h2{margin:0 0 10px;color:#212b32;font-size:21px;line-height:1.25}.button-placement-example p{margin:0 0 16px;color:#4c6272;font-size:16px;line-height:1.45}.button-placement-example .button-placement-example__nhs{padding:22px 20px 18px;border:1px solid #aeb9bd;background:#eef6fd}.button-placement-example .nhslogin-button{width:100%;margin:0}.button-placement-example__divider{display:flex;align-items:center;gap:12px;margin:34px 0 29px;color:#4c6272;font-weight:700;text-align:center}.button-placement-example__divider:before,.button-placement-example__divider:after{content:"";flex:1;border-top:2px dashed #4c6272}.button-placement-example__divider span{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid #d8dde0;border-radius:50%;background:#fff}.button-placement-example label{display:block;margin:0 0 6px;font-size:16px;font-weight:700}.button-placement-example input{box-sizing:border-box;width:100%;height:40px;margin:0 0 17px;border:1px solid #768692;background:#fff;font:inherit}.button-placement-example__service-button{margin:0;background:#007f3b;box-shadow:0 2px 0 #005a30}.button-placement-example__service-button:hover{background:#005a30}@media(max-width:400px){.button-placement-example__content{padding:20px}.button-placement-example h1{font-size:25px}.button-placement-example .nhslogin-button{font-size:16px}}
</style>
<div class="button-placement-example">
  <div class="button-placement-example__brand">
    <img src="/nhslogin/images/myhealth-app-wordmark.png" alt="MyHealth App">
  </div>
  <div class="button-placement-example__content">
    <h1>Sign in to MyHealth App</h1>
    <div class="button-placement-example__nhs">
      <h2>Use NHS login</h2>
      <p>Use your NHS login details to sign in or register.</p>
      <button class="nhslogin-button nhslogin-button-logo" type="button">
        <span class="button-logo" aria-hidden="true">
          <svg class="nhsuk-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 16" height="27" width="67">
            <path fill="#fff" d="M0 0h40v16H0z"></path>
            <path fill="#005eb8" d="M3.9 1.5h4.4l2.6 9h.1l1.8-9h3.3l-2.8 13H9l-2.7-9h-.1l-1.8 9H1.1M17.3 1.5h3.6l-1 4.9h4L25 1.5h3.5l-2.7 13h-3.5l1.1-5.6h-4.1l-1.2 5.6h-3.4M37.7 4.4c-.7-.3-1.6-.6-2.9-.6-1.4 0-2.5.2-2.5 1.3 0 1.8 5.1 1.2 5.1 5.1 0 3.6-3.3 4.5-6.4 4.5-1.3 0-2.9-.3-4-.7l.8-2.7c.7.4 2.1.7 3.2.7s2.8-.2 2.8-1.5c0-2.1-5.1-1.3-5.1-5 0-3.4 2.9-4.4 5.8-4.4 1.6 0 3.1.2 4 .6"></path>
          </svg>
        </span>
        Continue to NHS login
      </button>
    </div>
    <div class="button-placement-example__divider" aria-label="or"><span>or</span></div>
    <h2>Sign in with your MyHealth App account</h2>
    <label for="account-name">Account name</label>
    <input id="account-name" type="text">
    <label for="password">Password</label>
    <input id="password" type="password">
    <button class="nhslogin-button button-placement-example__service-button" type="button">Sign in</button>
  </div>
</div>


      </div>
    </div>
  </main>
</div>
<script src="nhslogin/js/iframeResizer.contentWindow.js" ></script>

</body>
</html>
