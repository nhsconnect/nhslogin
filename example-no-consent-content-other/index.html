     <link rel="stylesheet"  href="nhslogin/css/main.css">

<link rel="shortcut icon" href="/nhslogin/images/favicon.ico" type="image/x-icon">

<title>Standard no-consent error screen</title>
  </head>
  <body>

<div class="nhsuk-width-container">
  <main class="nhsuk-main-wrapper app-main-wrapper" id="maincontent">

            <style>
.no-consent-example-screen{max-width:294px;margin:0 auto;border:1px solid #a7b3b9;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.06);font-family:Arial,sans-serif}.no-consent-example-brand{height:48px;overflow:hidden;background:#f0faed;border-bottom:1px solid #c4dab9}.no-consent-example-brand img{display:block;width:100%;height:auto}.no-consent-example-body{padding:21px 20px 23px}.no-consent-example-body h1{font-size:23px;line-height:1.18;margin:0 0 18px;color:#212b32}.no-consent-example-body p{font-size:14px;line-height:1.43;margin:0 0 14px;color:#212b32}.no-consent-example-body a{font-size:14px}.no-consent-example-body p:last-child{margin-bottom:0}
</style>
<div class="no-consent-example-screen">
<div class="no-consent-example-brand"><img src="/nhslogin/images/myhealth-app-wordmark.png" alt="MyHealth App"></div>
<div class="no-consent-example-body">
<h1>You cannot continue without sharing your information</h1>
<p>MyHealth App needs your NHS login information to match you to your record.</p>
<p>Contact <a href="mailto:support@myhealthapp.co.uk">support@myhealthapp.co.uk</a> for more information.</p>
<p>If you need medical help, go to <a href="https://111.nhs.uk/">111.nhs.uk</a> or call <a href="tel:111">111</a>.</p>
<p>Call <a href="tel:999">999</a> if it is a life-threatening emergency.</p>
</div>
</div>


      </div>
    </div>
  </main>
</div>
<script src="nhslogin/js/iframeResizer.contentWindow.js" ></script>

</body>
